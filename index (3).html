<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="qmeng" content="qmeng-launcher">
<title>Q萌掼蛋</title>
<link href="fonts/fonts.css" rel="stylesheet">
<script src="config.js"></script>
<style>
:root{--felt:#3CC3A6;--felt-deep:#1F9C86;--panel:#FFFBEF;--ink:#2B2D5B;--honey:#FFC93C;--honey-deep:#D99A0E;--candy:#FF5A6E;--grape:#8A6CFF;
  --font:"ZCOOL KuaiLe","PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif;color-scheme:light;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--felt:#1F8A77;--felt-deep:#12594D;--panel:#2A2C4A;--ink:#F4F1FF;color-scheme:dark}}
:root[data-theme="dark"]{--felt:#1F8A77;--felt-deep:#12594D;--panel:#2A2C4A;--ink:#F4F1FF;color-scheme:dark}
*,*::before,*::after{box-sizing:inherit}
html,body{height:100%;margin:0}
body{background:radial-gradient(circle at 1px 1px,rgba(255,255,255,.1) 1.6px,transparent 2px) 0 0/22px 22px,radial-gradient(ellipse at 50% 40%,var(--felt),var(--felt-deep));
  font-family:var(--font);color:var(--ink);display:flex;align-items:center;justify-content:center;overflow:hidden;
  -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent}
.splash{display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.egg{width:min(42vmin,220px);height:auto;animation:bob 1.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-8px)}}
.logo{font-size:clamp(44px,12vmin,72px);color:var(--honey);-webkit-text-stroke:3px #2B2D5B;paint-order:stroke fill;text-shadow:0 5px 0 rgba(0,0,0,.18)}
.health{position:fixed;left:0;right:0;bottom:calc(env(safe-area-inset-bottom,0px) + 18px);text-align:center;color:#fff;opacity:.85;font-size:12px;line-height:1.7;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.mask{position:fixed;inset:0;background:rgba(20,40,50,.45);display:none;align-items:center;justify-content:center;padding:16px}
.mask.show{display:flex}
.card{background:var(--panel);color:var(--ink);border-radius:24px;padding:22px 20px 18px;width:min(400px,100%);max-height:calc(100% - 20px);overflow:auto;box-shadow:0 8px 0 rgba(0,0,0,.15);animation:pop .3s cubic-bezier(.3,1.5,.5,1)}
@keyframes pop{from{transform:scale(.6);opacity:0}}
.card h2{margin:0 0 10px;text-align:center;font-weight:400;font-size:26px}
.card p{margin:8px 0;font-size:14px;line-height:1.75;font-family:"PingFang SC","Microsoft YaHei","Noto Sans CJK SC",sans-serif}
.card b{color:var(--candy);font-weight:600}
.card a{color:var(--grape);text-decoration:none}
.row{display:flex;gap:12px;justify-content:center;margin-top:14px}
.btn{border:none;border-radius:999px;font-family:var(--font);font-size:18px;padding:10px 22px;white-space:nowrap;color:#2B2D5B;background:#fff;box-shadow:0 4px 0 #C9C2B0;cursor:pointer}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 #C9C2B0}
.btn.ok{background:var(--honey);box-shadow:0 4px 0 var(--honey-deep)}
.btn:focus-visible{outline:3px solid var(--honey);outline-offset:2px}
.tip{min-height:20px;text-align:center;color:var(--candy);font-size:13px;margin-top:8px;font-family:"PingFang SC","Microsoft YaHei",sans-serif}
@media (prefers-reduced-motion:reduce){*{animation:none!important}}
</style>
</head>
<body>
<div class="splash"><svg class="egg" viewBox="0 0 200 200" aria-hidden="true"><g><g transform="rotate(-20 70 70)"><rect x="40" y="22" width="56" height="78" rx="9" fill="#FFFDF7" stroke="#2B2D5B" stroke-width="4"/><text x="49" y="52" font-family="Arial Black,Arial" font-weight="900" font-size="26" fill="#E8253F">A</text><text x="58" y="88" font-family="Arial" font-size="30" fill="#E8253F">♥</text></g><g transform="rotate(20 130 70)"><rect x="104" y="22" width="56" height="78" rx="9" fill="#FFFDF7" stroke="#2B2D5B" stroke-width="4"/><text x="113" y="52" font-family="Arial Black,Arial" font-weight="900" font-size="26" fill="#2B2D5B">K</text><text x="122" y="88" font-family="Arial" font-size="30" fill="#2B2D5B">♠</text></g><path d="M100 44 C142 44 166 104 166 130 C166 166 137 186 100 186 C63 186 34 166 34 130 C34 104 58 44 100 44Z" fill="#FFF6DD" stroke="#2B2D5B" stroke-width="5"/><path d="M60 92 C70 70 84 60 96 58" stroke="#fff" stroke-width="8" fill="none" stroke-linecap="round" opacity=".9"/><ellipse cx="80" cy="128" rx="8" ry="10" fill="#2B2D5B"/><circle cx="83" cy="124" r="3.2" fill="#fff"/><ellipse cx="120" cy="128" rx="8" ry="10" fill="#2B2D5B"/><circle cx="123" cy="124" r="3.2" fill="#fff"/><ellipse cx="64" cy="146" rx="10" ry="6" fill="#FF7A8A" opacity=".6"/><ellipse cx="136" cy="146" rx="10" ry="6" fill="#FF7A8A" opacity=".6"/><path d="M90 146 q5 6 10 0 q5 6 10 0" stroke="#2B2D5B" stroke-width="4" fill="none" stroke-linecap="round"/></g></svg><div class="logo">Q萌掼蛋</div></div>
<div class="health">抵制不良游戏，拒绝盗版游戏。注意自我保护，谨防受骗上当。<br>适度游戏益脑，沉迷游戏伤身。合理安排时间，享受健康生活。</div>
<div class="mask" id="mask"><div class="card">
  <h2>欢迎来到 Q萌掼蛋</h2>
  <p>本游戏是<b>单机游戏</b>，不需要注册登录，<b>不收集、不上传任何个人信息</b>，也没有接入任何第三方统计、广告或支付服务。</p>
  <p>你选择的角色、昵称和设置只保存在你自己的手机上，卸载游戏即全部清除。</p>
  <p>请阅读 <a href="privacy.html?from=app" id="plink">《隐私政策》</a>，点「同意并继续」即表示你已阅读并同意。</p>
  <div class="row"><button class="btn" id="no">不同意</button><button class="btn ok" id="yes">同意并继续</button></div>
  <div class="tip" id="tip"></div>
</div></div>
<script>
var KEY='qmeng-privacy-ok-v1';
function agreed(){try{return localStorage.getItem(KEY)==='1'}catch(e){return false}}
function enter(ms){setTimeout(function(){location.replace('game.html')},ms)}
document.addEventListener('contextmenu',function(e){e.preventDefault()});
if(agreed())enter(1600);
else setTimeout(function(){document.getElementById('mask').classList.add('show')},700);
document.getElementById('yes').onclick=function(){try{localStorage.setItem(KEY,'1')}catch(e){}
  document.getElementById('mask').classList.remove('show');enter(900)};
document.getElementById('no').onclick=function(){document.getElementById('tip').textContent='需要同意隐私政策才能开始游戏；不同意可以直接退出应用。'};
</script>
</body>
</html>
